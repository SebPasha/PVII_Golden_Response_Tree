<title>Thailand on the Golden Tree</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Instrument+Serif:ital@0;1&family=DM+Mono&family=Jura:wght@400;600&display=swap">
<style>
/* Layout: the paddy drawing across the page (three stands over the water, one rice stalk per family), the plan strip and
   risk chips above it, the reading panel below it; the other readings are views under the same header. Dark by design. */
:root {
  --bg: #06110d; --panel: #0b1a14; --panel2: #10241c; --line: #1d3529; --sage: #8db8a0; --sage-d: #3e7a62; --pale: #cfe3d6;
  --gold: #d4a72c; --gold2: #f1d58a; --rust: #c2603f; --red: #d8625e; --amber: #c9a35a; --ok: #d4a72c;
  --display: "Italiana", "Didot", Georgia, serif; --serif: "Instrument Serif", Georgia, serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace; --label: "Jura", "Avenir Next", system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--pale); font: 14px/1.5 var(--label); }
.wrap { max-width: 1500px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.kicker { font-family: var(--mono); color: var(--gold); letter-spacing: .28em; font-size: 12px; text-transform: uppercase; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(38px, 6vw, 72px); letter-spacing: .06em; margin: 6px 0 2px; color: #fff; }
h1 .yrs { font-family: var(--mono); font-size: .32em; letter-spacing: .14em; color: var(--gold2); margin-left: .6em; vertical-align: middle; white-space: nowrap; }
.sub { font-family: var(--serif); font-style: italic; color: var(--gold2); font-size: clamp(19px, 2.4vw, 24px); margin: 0 0 14px; }
.live { font-size: 14.5px; color: var(--pale); margin: -4px 0 12px; line-height: 1.5; max-width: 980px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; font-family: var(--mono); font-size: 12px; color: var(--sage); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.stats b { color: var(--pale); font-weight: 400; }

.views { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 18px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.views .g { font-family: var(--mono); font-size: 10.5px; letter-spacing: .22em; color: var(--gold); align-self: center; margin-right: 4px; }
.views a { font-family: var(--mono); font-size: 12.5px; letter-spacing: .14em; color: var(--sage); padding: 3px 0; border-bottom: 1px solid transparent; text-decoration: none; text-transform: uppercase; }
.views a:hover { color: var(--pale); }
.views a[aria-current="page"] { color: var(--gold2); border-bottom-color: var(--gold); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.strip { display: flex; flex-wrap: wrap; gap: 10px 26px; margin: 14px 0 6px; }
.strip .grp { display: flex; align-items: flex-end; gap: 8px; overflow-x: auto; max-width: 100%; padding-bottom: 2px; }
.strip .grp .l { font-family: var(--mono); font-size: 10.5px; letter-spacing: .22em; color: var(--gold); align-self: center; margin-right: 4px; }
.thumb { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 3px; padding: 6px 8px; border: 1px solid var(--line); }
.thumb svg { width: 112px; height: 30px; display: block; }
.thumb .t { font-size: 12px; color: var(--pale); white-space: nowrap; }
.thumb .y { font-family: var(--mono); font-size: 10.5px; color: var(--sage); white-space: nowrap; }
.thumb:hover { border-color: var(--sage-d); }
.thumb[aria-pressed="true"] { border-color: var(--gold); background: var(--panel2); }
.thumb:disabled { cursor: default; opacity: .35; }
.thumb.part { opacity: .7; }
.thumb.vis { border-style: dashed; }
.sw { display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: 0; }

.risks { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 6px; align-items: center; }
.risks .l { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--gold); margin-right: 6px; }
.chip { font: 12px var(--label); color: var(--sage); background: transparent; border: 1px solid var(--line); padding: 4px 10px; border-radius: 2px; cursor: pointer; }
.chip:hover { color: var(--pale); border-color: var(--sage-d); }
.chip[aria-pressed="true"] { color: var(--bg); background: var(--sage); border-color: var(--sage); }
.find { display: flex; align-items: center; gap: 8px; margin-left: auto; }
input[type=search], select { font: 12.5px var(--label); color: var(--pale); background: var(--panel); border: 1px solid var(--line); padding: 5px 8px; border-radius: 2px; max-width: 230px; }
input[type=search]::placeholder { color: var(--sage); opacity: .7; }

.stage { position: relative; margin-top: 8px; overflow-x: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
svg#paddy { display: block; width: 100%; min-width: 900px; height: auto; }
.culm { cursor: pointer; }
.culm:focus { outline: none; }
.culm:focus-visible .hit, .culm.sel .hit { stroke: var(--gold2); stroke-width: 1.2; stroke-dasharray: 3 4; }
.culm.dim { opacity: .16; }
.mnode { cursor: pointer; }
.cloud { cursor: pointer; }
.cloud:focus { outline: none; }
.cloud:focus-visible ellipse:first-of-type { stroke: var(--gold); stroke-width: 1.5; }
#paddy .rain { pointer-events: none; }
#paddy.iso .culm .gr:not(.keep), #paddy.iso .culm .sl:not(.keep) { opacity: .12; }
#paddy.iso-nat .culm .sl { opacity: .1; }
@media (prefers-reduced-motion: no-preference) {
  @keyframes fall { to { stroke-dashoffset: -24; } }
  #paddy .rain line { animation: fall 1.4s linear infinite; }
  #paddy .culm, #paddy .gr, #paddy .sl { transition: opacity .2s; }
  @keyframes grainin { from { opacity: 0; } }
  #paddy.anim .gr { animation: grainin .7s ease-out; }
}
#tip { position: absolute; pointer-events: none; background: rgba(6, 17, 13, .95); border: 1px solid var(--line); padding: 8px 10px; font-size: 12px; max-width: 300px; line-height: 1.45; display: none; z-index: 3; }
#tip b { display: block; color: #fff; font-weight: 600; margin-bottom: 2px; }
#tip .m { font-family: var(--mono); color: var(--sage); font-size: 11px; }
.key { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 24px; margin: 18px 0 0; }
.key div { font-size: 13px; color: var(--sage); line-height: 1.45; min-width: 0; }
.key b { display: block; font-family: var(--mono); font-weight: 400; color: var(--gold); letter-spacing: .2em; font-size: 11px; margin-bottom: 3px; }
.key i { display: inline-block; width: 10px; height: 6px; border-radius: 50%; margin: 0 4px 0 0; vertical-align: 1px; }

#panel { margin-top: 28px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 28px; }
@media (max-width: 880px) { #panel { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); padding: 20px 22px; min-width: 0; }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 30px; color: #fff; margin: 4px 0 6px; letter-spacing: .03em; text-wrap: balance; }
.path { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--gold); text-transform: uppercase; }
.card p { font-size: 14px; line-height: 1.55; color: var(--pale); margin: 8px 0; }
.quote { font-family: var(--serif); font-style: italic; font-size: 17px !important; color: var(--gold2) !important; }
h3 { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .2em; color: var(--gold); margin: 18px 0 8px; text-transform: uppercase; }
.mech { display: grid; grid-template-columns: minmax(0, 1fr) 90px 52px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; }
.mech small { display: block; color: var(--sage); font-size: 11.5px; }
.mech .bar { height: 6px; background: var(--line); }
.mech .bar i { display: block; height: 100%; background: var(--gold); }
.mech .n { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--sage); font-variant-numeric: tabular-nums; }
.mech .n em { font-style: normal; color: var(--sage); opacity: .8; }
.mech.off { color: var(--sage); opacity: .65; }
.mech:hover { color: #fff; opacity: 1; }
.mech[aria-pressed="true"] { color: var(--gold2); opacity: 1; box-shadow: inset 2px 0 0 var(--gold); padding-left: 6px; }
.pw { margin: 4px 0 10px 12px; border-left: 1px solid var(--sage-d); padding-left: 10px; }
.pw .mech { grid-template-columns: minmax(0, 1fr) 52px; font-size: 12.5px; }
.strat { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; line-height: 1.45; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .04em; color: var(--sage); }
.tag { border: 1px solid var(--line); padding: 1px 6px; overflow-wrap: anywhere; }
.tag.l3 { color: var(--bg); background: var(--gold2); border-color: var(--gold2); }
.tag.l2 { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.tag.l1 { color: var(--pale); }
.tag.ok { color: var(--gold2); border-color: var(--gold); }
.tag.weak { color: var(--pale); border-color: var(--sage-d); }
.tag.bad { color: var(--rust); border-color: var(--rust); }
.tag.sec { color: var(--pale); }
.list { max-height: 640px; overflow-y: auto; padding-right: 6px; }
.empty, .hint { color: var(--sage); font-size: 13px; }
.mfilter { font-family: var(--mono); font-size: 12px; color: var(--gold2); }
.linkbtn { all: unset; cursor: pointer; color: var(--sage); text-decoration: underline; }

.growth { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 18px; }
.growth p { font-size: 13px; color: var(--sage); margin: 0 0 14px; max-width: 820px; line-height: 1.5; }
.rkey { font-family: var(--mono); font-size: 11px; color: var(--sage); }
.rkey b { font-weight: 400; color: var(--pale); }
.grow { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.grow figure { margin: 0; flex: 0 0 auto; width: min(300px, 78vw); }
.grow svg { width: 100%; height: auto; display: block; background: linear-gradient(#06110d, #0c2219); }
.grow figcaption { font-family: var(--mono); font-size: 12px; color: var(--pale); margin-top: 6px; line-height: 1.5; }
.grow figcaption b { font-weight: 400; color: var(--gold2); margin-right: 6px; }
.grow figcaption span { display: block; color: var(--sage); font-size: 11px; }
.grow .step { flex: 0 0 auto; font-family: var(--mono); color: var(--sage); font-size: 11px; text-align: center; line-height: 1.6; min-width: 64px; }
.grow .step b { display: block; font-size: 18px; font-weight: 400; color: var(--sage); }
.grow .step .a { color: var(--gold2); } .grow .step .d { color: var(--rust); }
.grow .apart { flex: 0 0 auto; width: 1px; align-self: stretch; background: var(--line); margin: 0 10px; }
.foot { margin-top: 36px; font-family: var(--mono); font-size: 11.5px; color: var(--sage); line-height: 1.7; }

/* readings */
section[hidden] { display: none; }
.note { font-size: 13.5px; color: var(--pale); border-left: 2px solid var(--gold); padding: 4px 12px; margin: 14px 0; max-width: 92ch; line-height: 1.55; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 16px 0; }
.tile { background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; }
.tile .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; color: var(--gold); text-transform: uppercase; }
.tile b { display: block; font: 400 34px/1.1 var(--display); color: #fff; margin-top: 6px; font-variant-numeric: tabular-nums; }
.tile .d { font-size: 12px; color: var(--sage); margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; align-items: start; }
.grid2 > * { min-width: 0; }
.bars { display: grid; grid-template-columns: minmax(120px, 2fr) 5fr auto; gap: 4px 10px; align-items: center; font-size: 13px; }
.bars .n { text-align: right; font-family: var(--mono); font-size: 11.5px; color: var(--sage); min-width: 64px; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--line); position: relative; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); }
.bar i.s { background: var(--sage); opacity: .8; top: 5px; }
.bar i.cmp { background: transparent; border-right: 2px solid var(--pale); }
.bars .k { cursor: default; }
.bars .k.go { cursor: pointer; }
.bars .k.go:hover { color: var(--gold2); }
.grp { margin: 12px 0 4px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--sage); text-transform: uppercase; }
.grp b { color: var(--pale); font-weight: 400; }
.frame { overflow: auto; max-width: 100%; border: 1px solid var(--line); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--panel2); font: 400 10.5px var(--mono); letter-spacing: .14em; color: var(--gold); text-transform: uppercase; cursor: pointer; white-space: nowrap; user-select: none; z-index: 1; }
th .dir { color: var(--gold2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.num { font-family: var(--mono); font-size: 12px; }
td .tag { white-space: nowrap; overflow-wrap: normal; }
tr.sec td { color: var(--sage); }
tr.sec td:first-child { box-shadow: inset 3px 0 0 var(--sage-d); }
.small { font-size: 12px; color: var(--sage); }
.mono { font-family: var(--mono); font-size: 11.5px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 12px 0; }
.filters label { display: flex; flex-direction: column; gap: 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; color: var(--gold); text-transform: uppercase; }
button.plain { font: 12px var(--label); color: var(--sage); background: transparent; border: 1px solid var(--line); padding: 5px 10px; cursor: pointer; border-radius: 2px; }
button.plain:hover { color: var(--pale); border-color: var(--sage-d); }
.heat { display: grid; gap: 3px 8px; font-size: 12.5px; align-items: center; }
.heat .h { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; color: var(--gold); text-transform: uppercase; }
.heat .r { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell { height: 24px; border: 1px solid transparent; cursor: pointer; font: 11px var(--mono); color: var(--bg); background: var(--line); }
.cell:hover, .cell[aria-pressed="true"] { border-color: var(--pale); }
.cell.green { background: color-mix(in oklab, var(--gold) var(--a), var(--panel)); }
.cell.amber { background: color-mix(in oklab, var(--sage) var(--a), var(--panel)); }
.cell.red { background: color-mix(in oklab, var(--red) var(--a), var(--panel)); color: #fff; }
.cell.none { background: var(--panel2); color: var(--sage); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--sage); margin: 10px 0; align-items: center; }
.legend .sw { width: 12px; height: 12px; }
.cols { columns: 2 340px; column-gap: 32px; }
.cols p { break-inside: avoid; margin: 0 0 12px; font-size: 13.5px; line-height: 1.6; }
.cols p b { color: var(--gold2); font-weight: 400; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; display: block; }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.wrapc { white-space: normal; }
details summary { cursor: pointer; color: var(--gold2); font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; margin-top: 10px; }
</style>

<div class="wrap">
  <div class="kicker">Project Vision II · The golden tree v2</div>
  <h1 id="cname">THAILAND</h1>
  <p class="sub" id="cline">Rice in the flooded paddy: one stalk per family, one branch of the head per mechanism, one grain per strategy.</p>
  <p class="live" id="live" aria-live="polite"></p>
  <div class="stats" id="stats"></div>
  <div class="strip" id="strip"></div>
  <nav class="views" id="views" aria-label="Views"><span class="g">READ AS</span>
    <a href="#paddy">The paddy</a><a href="#profile">Profile</a><a href="#strategies">Strategies</a><a href="#risks">Risks</a><a href="#time">Over time</a>
    <a href="#sector">Sector plans</a><a href="#crosswalks">Crosswalks</a><a href="#test">Bottom-up test</a><a href="#method">Method</a></nav>

  <section id="v-paddy">
    <div class="risks" id="riskchips"><span class="l">STORM</span></div>
    <div class="risks"><span class="l">FIND</span><input type="search" id="find" placeholder="words in a strategy or objective" aria-label="Find strategies"><span class="small" id="findn"></span></div>

<script>
const D = /*DATA*/;
const TEST = /*TEST*/;
const T = D.tree, FAM = Object.fromEntries(T.families.map(f => [f.family_id, f])), MEC = Object.fromEntries(T.mechanisms.map(m => [m.mechanism_id, m])),
      PATH = Object.fromEntries(T.pathways.map(p => [p.pathway_id, p])), SUB = Object.fromEntries(T.subpillars.map(s => [s.code, s]));
const PLANS = D.plans, M = D.measures, S = D.strategies, RISKS = T.risks, SDGDIM = T.sdg_dim || {};
S.forEach((s, i) => (s.i = i));
const NAT = PLANS.map((p, i) => i).filter(i => PLANS[i].doc_type !== "sector"), SEC = PLANS.map((p, i) => i).filter(i => PLANS[i].doc_type === "sector");
const NDP = NAT.filter(i => PLANS[i].doc_type === "ndp").sort((a, b) => PLANS[a].period_start - PLANS[b].period_start), VIS = NAT.filter(i => PLANS[i].doc_type === "vision");
const LATEST = NDP[NDP.length - 1];
const ORDER = ["SMG", "PFA", "MCH"], STAND = { SMG: "ECONOMY", PFA: "PEOPLE", MCH: "GOVERNANCE" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pct = x => (100 * (x || 0)).toFixed(x >= .1 || !x ? 0 : 1) + "%";
const n0 = x => Number(x || 0).toLocaleString("en-GB");
const by = (arr, f) => { const o = {}; arr.forEach(x => { const k = f(x); o[k] = (o[k] || 0) + 1; }); return o; };
const sortDesc = o => Object.entries(o).sort((a, b) => b[1] - a[1]);
const isSec = i => PLANS[i].doc_type === "sector";
const planShort = i => PLANS[i].short || PLANS[i].title;
const planLabel = i => `${planShort(i)} ${PLANS[i].period_start}–${PLANS[i].period_end}`;
const famOrder = ORDER.flatMap(p => T.subpillars.filter(s => s.pillar === p)).flatMap(s => T.families.filter(f => f.subpillar_code === s.code).map(f => f.family_id));
const strong = k => k.startsWith("mechanism-consistent");
const kindCls = k => strong(k) ? "ok" : k === "mention-only" ? "bad" : "weak";

// ---------------------------------------------------------------- state
// plan: a national document index, or null for the three five-year plans together. secOn: sector plans switched on (off by default:
// they are a subordinate layer and the national plan leads).
let plan = LATEST, secOn = new Set(), active = null, findQ = "", selFam = null, selMec = null, selPath = null, iso = null, animate = false;
try { const p = JSON.parse(localStorage.getItem("gt3") || "{}"); if (p.plan === null || (Number.isInteger(p.plan) && PLANS[p.plan] && !isSec(p.plan))) plan = p.plan; if (Array.isArray(p.on)) secOn = new Set(p.on.filter(i => PLANS[i] && isSec(i))); } catch (e) {}
const save = () => { try { localStorage.setItem("gt3", JSON.stringify({ plan, on: [...secOn] })); } catch (e) {} };
const natIn = () => plan === null ? NDP : [plan];
function years() { const n = natIn(); return [Math.min(...n.map(i => PLANS[i].period_start)), Math.max(...n.map(i => PLANS[i].period_end))]; }
const ov = i => { const y = years(); return [Math.max(y[0], PLANS[i].period_start), Math.min(y[1], PLANS[i].period_end)]; };
const fits = i => { const o = ov(i); return o[0] <= o[1]; };
const secIn = () => SEC.filter(i => secOn.has(i) && fits(i));
const natRows = () => { const n = new Set(natIn()); return S.filter(s => n.has(s.p)); };
const secRows = () => { const n = new Set(secIn()); return S.filter(s => n.has(s.p)); };
const hit = s => !active || s.links.some(l => l.risk === active);
const found = s => !findQ || `${s.name} ${s.objective} ${s.target_label} ${s.instrument_label}`.toLowerCase().includes(findQ);
const linkOf = s => active ? s.links.find(l => l.risk === active) : null;

// ---------------------------------------------------------------- readings: shared pieces
function barsHtml(entries, total, o = {}) {
  const max = Math.max(1e-9, ...entries.map(e => e[1] / total), ...(o.cmp ? entries.map(e => o.cmp[e[0]] || 0) : []));
  return `<div class="bars">${entries.map(([k, v]) => { const share = v / total, sv = o.secN && o.sec ? (o.sec[k] || 0) / o.secN : 0;
    return `<span class="k ${o.go ? "go" : ""}" data-k="${esc(k)}" title="${esc(o.title ? o.title(k) : k)}">${esc(o.label ? o.label(k) : k)}</span>
    <span class="bar"><i style="width:${100 * share / max}%"></i>${sv ? `<i class="s" style="width:${100 * sv / max}%"></i>` : ""}${o.cmp && o.cmp[k] != null ? `<i class="cmp" style="width:${100 * o.cmp[k] / max}%"></i>` : ""}</span>
    <span class="n">${o.raw ? n0(v) : `${n0(v)} · ${pct(share)}`}</span>`; }).join("")}</div>`;
}
function sortable(table, rows, cols, render, o = {}) {
  let key = o.key || cols[0].k, dir = o.dir || 1;
  const draw = () => { const sorted = [...rows].sort((a, b) => { const x = a[key], y = b[key]; return (typeof x === "number" && typeof y === "number" ? x - y : String(x ?? "").localeCompare(String(y ?? ""))) * dir; });
    table.innerHTML = `<thead><tr>${cols.map(c => `<th class="${c.num ? "num" : ""}" data-k="${c.k}" tabindex="0" aria-sort="${key === c.k ? (dir > 0 ? "ascending" : "descending") : "none"}">${esc(c.h)}${key === c.k ? `<span class="dir"> ${dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`).join("")}</tr></thead><tbody>${sorted.slice(0, o.limit || 5000).map(render).join("")}</tbody>`;
    table.querySelectorAll("th").forEach(th => { const go = () => { const k = th.dataset.k; dir = key === k ? -dir : 1; key = k; draw(); }; th.onclick = go; th.onkeydown = e => { if (e.key === "Enter") go(); }; }); };
  draw();
}

// ---------------------------------------------------------------- method
function method() {
  document.getElementById("v-method").innerHTML = `<div class="cols" style="margin-top:16px">
    <p><b>The tree</b>RHDR pillar, then RHDR category, then family (28: what is built or protected), mechanism (99: the lever a plan pulls, in plan-chapter language, each with the intermediate variable it moves) and pathway (259: the causal channel, with its citation, risk tags and text cues; the v1 mechanisms with frozen ids). Seven pathway pairs are merged; the merged id counts on its survivor.</p>
    <p><b>Placement</b>A strategy sits at the deepest level its whole wording supports. Pathway placements come from the v1 run. A strategy v1 held at a family falls to its v2 family and is tried against the plan words of that family's mechanisms: exactly one match places it at the mechanism, flagged provisional until step M re-runs on v2; several or none leave it at the family with the candidates listed. Nothing is invented.</p>
    <p><b>Shares, not counts</b>Plans differ in length, so every comparison is a share of a plan's placed strategies. Goal-shaped and Standard-branch strategies are outside the tree and outside the denominators.</p>
    <p><b>Risk links</b>Each strategy carries the risks step E found quoted beside it. The flag joins what the plan says with what the literature says: mechanism-consistent, family-depth, affected-group support, or mention-only.</p>
    <p><b>The storm test</b>Per risk and mechanism: sheltered with a mechanism-consistent strategy, partly with only weaker links, exposed when the plans frame the risk and the literature ties it to a mechanism no strategy reaches.</p>
    <p><b>SDG</b>Targets sit on mechanisms, so a plan's SDG and 5 P profile falls out of its placements. Coherence against the targets step E names per strategy needs the run outputs.</p>
    <p><b>Over time</b>Five-year plans are compared with each other; the National Strategy is a different document class and stands apart. Carried, added and dropped are read at mechanism level between consecutive editions.</p>
    <p><b>Sector plans</b>Read against the national plan in force, drawn as coloured leaves, never added to national counts.</p>
    <p><b>Classes</b>Target groups roll up to 11 classes, instruments to Hood's four resources of government: information, authority, money, organisation.</p>
    <p><b>What this cannot say</b>That an instrument will work here, that a country is at risk, or that a plan addresses a risk. It can say: the plan names a lever the literature links to the risk; placed at the family, the plan does not name the channel; the plan frames it as a risk.</p>
    <p><b>Source</b>${esc(D.meta.source)}. ${esc(D.meta.note)}</p></div>`;
}
